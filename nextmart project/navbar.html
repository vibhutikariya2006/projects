<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Navbar</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body style="font-family: Roboto, sans-serif;">

    <!-- Top Header -->
    <header class="bg-[#003EAC]">

        <div class="max-w-7xl mx-auto px-4">

            <div class="flex flex-col lg:flex-row items-center gap-6 lg:gap-12 py-5">

                <!-- Logo -->
                <img src="./src/logo-light.png"
                    class="w-[180px]"
                    alt="logo">

                <!-- Search -->
                <div class="w-full lg:flex-1 max-w-[700px] h-[55px] bg-white rounded-full flex items-center overflow-visible">

                    <div class="w-[35%] border-r px-5 relative group flex items-center justify-between cursor-pointer">

                        <span>Select Categories</span>

                        <i class="ri-arrow-down-s-line"></i>

                        <ul id="searchCategoryMenu"
                            class="absolute top-full left-0 w-full bg-white shadow-lg hidden group-hover:block z-50">
                        </ul>

                    </div>

                    <input type="text"
                        placeholder="Search products..."
                        class="flex-1 h-full px-4 outline-none">

                    <button class="w-[60px] h-[45px] bg-[#F5A300] rounded-full mr-1 text-white">
                        <i class="ri-search-line"></i>
                    </button>

                </div>

                <!-- Language -->
                <div class="relative group hidden sm:block">

                    <div class="flex items-center gap-2 text-white cursor-pointer">

                        <img src="https://flagcdn.com/w40/gb.png"
                            class="w-6 h-6 rounded-full">

                        <span>EN</span>

                        <i class="ri-arrow-down-s-line"></i>

                    </div>

                    <div id="languageMenu"
                        class="absolute top-full mt-2 bg-white rounded-lg shadow-lg hidden group-hover:block min-w-[120px] z-50">
                    </div>

                </div>

                <!-- Hotline -->
                <div class="flex items-center gap-3 text-white hidden sm:block">

                    <i class="ri-customer-service-2-line text-4xl"></i>

                    <div>

                        <h2 class="font-bold">
                            +91 2345 678
                        </h2>

                        <p class="text-sm">
                            Hotline 24/7
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </header>

    <!-- Navbar -->
    <nav class="border-b bg-white">

        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">

            <!-- Mobile Buttons -->
            <div class="flex lg:hidden items-center gap-3">

                <button id="categoryBtn"
                    class="border border-gray-300 px-4 py-2 rounded-lg flex items-center gap-2">

                    <i class="ri-apps-line"></i>

                    Categories

                </button>

                <button id="menuBtn"
                    class="border border-gray-300 px-4 py-2 rounded-lg flex items-center gap-2">

                    <i class="ri-menu-line"></i>

                    Menu

                </button>

            </div>

            <!-- Desktop Category -->
            <div class="hidden lg:block relative group">

                <button class="border border-gray-300 px-5 h-14 min-w-[250px] flex items-center justify-between">

                    <div class="flex items-center gap-3">

                        <i class="ri-menu-line"></i>

                        <span>All Categories</span>

                    </div>

                    <i class="ri-arrow-down-s-line"></i>

                </button>

                <ul id="categoryMenu"
                    class="absolute top-full left-0 w-full bg-white shadow-lg hidden group-hover:block z-50">
                </ul>

            </div>

            <!-- Desktop Menu -->
            <ul id="navMenu"
                class="hidden lg:flex items-center gap-8 font-medium">
            </ul>

            <!-- Icons -->
            <div class="flex items-center gap-5 text-xl">

                <i class="ri-repeat-line cursor-pointer"></i>

                <i class="ri-heart-line cursor-pointer"></i>

                <div class="relative">

                    <i class="ri-shopping-bag-line cursor-pointer"></i>

                    <span class="absolute -top-2 -right-2 bg-orange-500 text-white w-5 h-5 rounded-full text-xs flex items-center justify-center">

                        2

                    </span>

                </div>

            </div>

        </div>

        <!-- Mobile Categories -->
        <div id="mobileCategories"
            class="hidden lg:hidden border-t bg-white">

            <ul id="mobileCategoryMenu"></ul>

        </div>

        <!-- Mobile Menu -->
        <div id="mobileMenu"
            class="hidden lg:hidden border-t bg-white">

            <ul id="mobileNavMenu"></ul>

        </div>

    </nav>

<script src="navbar.js"></script>

</body>
</html>
